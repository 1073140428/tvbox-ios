name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' TVBox.xcodeproj/project.pbxproj
          grep -m1 objectVersion TVBox.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project TVBox.xcodeproj \
            -target TVBox \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/TVBox.app Payload/
          zip -r TVBox.ipa Payload
          ls -la TVBox.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TVBox-ipa
          path: TVBox.ipa
          if-no-files-found: error
